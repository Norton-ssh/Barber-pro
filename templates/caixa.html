{% extends "base.html" %}{% block content %}<div class="top"><h1>Caixa</h1><form><input type="date" name="data" value="{{data}}" onchange="this.form.submit()"></form></div><div class="cards"><div class="card"><div class="label">Total</div><div class="big gold">R$ {{'%.2f'|format(total)}}</div></div></div><div class="grid"><div class="panel"><h2>Nova venda</h2><form method="post"><input type="hidden" name="data" value="{{data}}"><div class="field"><label>Cliente</label><select name="cliente_id"><option value="">Não cadastrado</option>{% for x in clientes %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="field"><label>Barbeiro</label><select name="barbeiro_id" required>{% for x in barbeiros %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="field"><label>Serviço</label><select name="servico_id">{% for x in servicos %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="field"><label>Valor</label><input name="valor" type="number" step=".01" required></div><div class="field"><label>Pagamento</label><select name="pagamento"><option>PIX</option><option>Cartão</option><option>Dinheiro</option><option>Outro</option></select></div><button class="btn">Lançar</button></form></div><div class="panel"><h2>Vendas</h2><table class="table"><tr><th>Hora</th><th>Cliente</th><th>Barbeiro</th><th>Valor</th><th>Pagamento</th></tr>{% for r in rows %}<tr><td>{{r.hora}}</td><td>{{r.cliente or '-'}}</td><td>{{r.barbeiro}}</td><td>R$ {{'%.2f'|format(r.valor)}}</td><td>{{r.pagamento}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
