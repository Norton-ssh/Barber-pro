{% extends "base.html" %}{% block content %}<h1>Serviços</h1><div class="grid"><div class="panel"><h2>Novo serviço</h2><form method="post"><div class="field"><label>Nome</label><input name="nome" required></div><div class="field"><label>Duração</label><input name="duracao" type="number" value="30"></div><div class="field"><label>Preço</label><input name="preco" type="number" step=".01" value="0"></div><button class="btn">Cadastrar</button></form></div><div class="panel"><table class="table"><tr><th>Serviço</th><th>Duração</th><th>Preço</th></tr>{% for r in rows %}<tr><td>{{r.nome}}</td><td>{{r.duracao}} min</td><td>R$ {{'%.2f'|format(r.preco)}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
