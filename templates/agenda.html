{% extends "base.html" %}{% block content %}<div class="top"><h1>Agenda</h1><form><input type="date" name="data" value="{{data}}" onchange="this.form.submit()"></form></div><div class="grid"><div class="panel"><h2>Novo agendamento</h2><form method="post"><div class="field"><label>Cliente</label><select name="cliente" required>{% for x in clientes %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="field"><label>Barbeiro</label><select name="barbeiro" required>{% for x in barbeiros %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="field"><label>Serviço</label><select name="servico" required>{% for x in servicos %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="field"><label>Data</label><input name="data" type="date" value="{{data}}" required></div><div class="field"><label>Hora</label><input name="hora" type="time" required></div><button class="btn">Agendar</button></form></div><div class="panel"><table class="table"><tr><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Barbeiro</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{r.hora}}</td><td>{{r.cliente}}</td><td>{{r.servico}}</td><td>{{r.barbeiro}}</td><td>{{r.status}}</td><td class="actions"><a class="btn" href="/agenda/status/{{r.id}}/Concluído">Concluir</a><a class="btn red" href="/agenda/status/{{r.id}}/Cancelado">Cancelar</a></td></tr>{% endfor %}</table></div></div>{% endblock %}
