<!doctype html><html lang="pt-br"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px Arial;background:#151515;margin:0;color:#222}.box{max-width:520px;margin:30px auto;background:#fff;padding:25px;border-radius:15px}.gold{color:#c69a45}.field label{display:block;color:#666;font-size:12px}.field input,.field select{width:100%;padding:12px;margin:5px 0 13px;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#c69a45;color:#fff;font-weight:bold}.flash{background:#f1e5cf;padding:10px;border-radius:8px;margin-bottom:12px}</style><div class="box"><h1>VIP <span class="gold">BARBEARIA</span></h1><h2>Agende seu horário</h2>{% for x in get_flashed_messages() %}<div class="flash">{{x}}</div>{% endfor %}<form method="post"><div class="field"><label>Nome</label><input name="nome" required></div><div class="field"><label>Telefone</label><input name="telefone" required></div><div class="field"><label>Barbeiro</label><select name="barbeiro" required>{% for x in barbeiros %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="field"><label>Serviço</label><select name="servico" required>{% for x in servicos %}<option value="{{x.id}}">{{x.nome}} — R$ {{'%.2f'|format(x.preco)}}</option>{% endfor %}</select></div><div class="field"><label>Data</label><input name="data" type="date" required></div><div class="field"><label>Horário</label><input name="hora" type="time" required></div><button>Solicitar agendamento</button></form></div>
