{% extends "base.html" %}{% block content %}<h1>Configurações</h1><div class="panel" style="max-width:700px"><h2>Administrador</h2><form method="post"><div class="field"><label>Nome</label><input name="nome" value="{{usuario.nome}}" required></div><div class="field"><label>E-mail</label><input name="email" type="email" value="{{usuario.email}}" required></div><div class="field"><label>Nova senha</label><input name="senha" type="password" placeholder="Deixe em branco para manter a atual"></div><button class="btn">Salvar alterações</button></form></div><div class="panel" style="max-width:700px;margin-top:14px"><h2>Usuários e permissões</h2><p>Cadastre Administrador, Colaborador Fixo ou Colaborador Eventual.</p><a class="btn" href="/usuarios">Gerenciar usuários</a></div>{% endblock %}
