{% extends "base.html" %}{% block content %}<h1>Barbeiros</h1><div class="grid"><div class="panel"><h2>Novo barbeiro</h2><form method="post"><div class="field"><label>Nome</label><input name="nome" required></div><div class="field"><label>Telefone</label><input name="telefone"></div><div class="field"><label>Comissão %</label><input name="comissao" type="number" step=".01" value="40"></div><button class="btn">Cadastrar</button></form></div><div class="panel"><table class="table"><tr><th>Nome</th><th>Telefone</th><th>Comissão</th></tr>{% for r in rows %}<tr><td>{{r.nome}}</td><td>{{r.telefone}}</td><td>{{r.comissao}}%</td></tr>{% endfor %}</table></div></div>{% endblock %}
