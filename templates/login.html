<!doctype html><html lang="pt-br"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{cfg.STORE_NAME}} — Login</title><style>body{font-family:Arial;background:{{cfg.DARK_COLOR}};display:grid;place-items:center;height:100vh;margin:0}.box{background:#fff;padding:30px;border-radius:15px;width:min(380px,90%)}.brand img{max-width:140px;max-height:65px}input{width:100%;padding:12px;margin:7px 0 14px;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;background:{{cfg.PRIMARY_COLOR}};color:#fff;border:0;border-radius:8px;font-weight:bold}.err{color:#a33}</style><div class="box">{% if cfg.SHOW_LOGO %}<div class="brand"><img src="{{url_for('static',filename=cfg.LOGO_FILE)}}" alt="{{cfg.STORE_NAME}}"></div>{% endif %}<h1>{{cfg.STORE_NAME}}</h1><p>{{cfg.LOGIN_SUBTITLE}}</p>{% for x in get_flashed_messages() %}<p class="err">{{x}}</p>{% endfor %}<form method="post"><input name="email" type="email" placeholder="E-mail" required><input name="senha" type="password" placeholder="Senha" required><button>Entrar</button></form></div>
