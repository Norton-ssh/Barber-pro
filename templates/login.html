<!doctype html><html lang="pt-br"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#151515;display:grid;place-items:center;height:100vh;margin:0}.box{background:#fff;padding:30px;border-radius:15px;width:min(380px,90%)}input{width:100%;padding:12px;margin:7px 0 14px;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;background:#c69a45;color:#fff;border:0;border-radius:8px;font-weight:bold}.err{color:#a33}</style><div class="box"><h1>VIP <span style="color:#c69a45">BARBEARIA</span></h1><p>Entrar no painel</p>{% for x in get_flashed_messages() %}<p class="err">{{x}}</p>{% endfor %}<form method="post"><input name="email" type="email" placeholder="E-mail" required><input name="senha" type="password" placeholder="Senha" required><button>Entrar</button></form><p style="font-size:12px;color:#777">Acesso inicial: admin@barberpro.local / 123456</p></div>
