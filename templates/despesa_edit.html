{% extends "base.html" %}{% block content %}<div class="top"><h1>Editar despesa</h1></div><div class="panel" style="max-width:700px"><form method="post"><div class="field"><label>Descrição</label><input name="descricao" value="{{edit.descricao}}" required></div><div class="field"><label>Valor</label><input name="valor" type="number" step=".01" value="{{edit.valor}}" required></div><div class="field"><label>Tipo</label><select name="tipo"><option {% if edit.tipo=='Fixa' %}selected{% endif %}>Fixa</option><option {% if edit.tipo=='Variável' %}selected{% endif %}>Variável</option></select></div><div class="field"><label>Data</label><input name="data" type="date" value="{{edit.data}}" required></div><div class="field"><label><input type="checkbox" name="recorrente" {% if edit.recorrente %}checked{% endif %}> Despesa fixa recorrente</label></div><div class="field"><label>Observações</label><textarea name="observacoes">{{edit.observacoes}}</textarea></div><button class="btn">Salvar alterações</button> <a class="btn gray" href="/despesas">Cancelar</a></form></div>{% endblock %}
