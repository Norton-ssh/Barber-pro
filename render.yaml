services:
  - type: web
    name: vip-barbearia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vip-barbearia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: vip-barbearia-db
    plan: free
